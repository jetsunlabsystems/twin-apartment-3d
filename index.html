<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>عمارة سكنية فاخرة · شقتين متطابقتين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="app">
  <header>
    <div class="grp" id="paneBtns">
      <button class="btn chip" id="tgLib" data-en="◧ Library">◧ مكتبة الأثاث</button>
      <button class="btn chip" id="tgPanel" data-en="Properties ◨">الخصائص ◨</button>
    </div>
    <div class="brand"><b data-en="3BR 2LR 2BA · Interior Design">عمارة سكنية فاخرة · شقتين متطابقتين</b><span id="subtitle">تصميم معماري وتأثيث داخلي 1:60 · الأبعاد بالمليمتر (mm)</span></div>
    <div class="grp seg" id="viewSeg" title="تبديل 2D / 3D (T)" data-en-title="Switch 2D / 3D (T)">
      <span class="pill"></span>
      <button class="btn" data-view="2d" data-en="2D Plan">مخطط 2D</button>
      <button class="btn" data-view="3d" data-en="3D Scene">مشهد 3D</button>
    </div>
    <div class="grp only2d" id="tools">
      <button class="btn on" data-tool="select" title="تحديد / تحريك (V)" data-en-title="Select / Move (V)" data-en="Select">تحديد</button>
      <button class="btn" data-tool="measure" title="قياس الأبعاد (M)" data-en-title="Measure (M)" data-en="Measure">قياس</button>
      <button class="btn" data-tool="demolish" title="تعديل الجدران (X)" data-en-title="Demolish non-bearing walls (X)" data-en="Demolish">تعديل الجدران</button>
    </div>
    <div class="grp only2d">
      <button class="btn" id="zoomOut" title="تصغير" data-en-title="Zoom out">−</button>
      <span class="scale-label" id="scale" style="min-width:38px;text-align:center;font-size:11px;font-weight:600;opacity:0.8;padding:0 2px;user-select:none;display:inline-flex;align-items:center;justify-content:center;">100%</span>
      <button class="btn" id="zoomIn" title="تكبير" data-en-title="Zoom in">＋</button>
      <button class="btn" id="fit" title="ملاءمة الشاشة (F)" data-en-title="Fit to window (F)" data-en="Fit">ملاءمة</button>
      <button class="btn" id="s60" title="عرض بمقياس 1:60 (مطابق للمخطط الأصلي)" data-en-title="Show at 1:60 (same scale as the original plan)">1:60</button>
      <button class="btn" id="s100" title="عرض بمقياس 1:100" data-en-title="Show at 1:100">1:100</button>
    </div>
    <div class="grp only3d" id="modes3d">
      <button class="btn on" data-mode="orbit" data-en="Orbit">منظور علوي</button>
      <button class="btn" data-mode="walk" data-en="Walk">جولة 3D</button>
    </div>
    <div class="grp only3d">
      <button class="btn" id="vIso" data-en="Iso">منظور مائل</button>
      <button class="btn" id="vTop" data-en="Top">مسقط رأسي</button>
    </div>
    <div class="grp">
      <button class="btn" id="undo" title="تراجع (Ctrl+Z)" data-en-title="Undo (Ctrl+Z)" data-en="Undo">تراجع</button>
      <button class="btn" id="redo" title="إعادة (Ctrl+Shift+Z)" data-en-title="Redo (Ctrl+Shift+Z)" data-en="Redo">إعادة</button>
      <button class="btn danger" id="clearAll" title="إفراغ جميع الأثاث (يمكن التراجع)" data-en-title="Remove all furniture and appliances (undoable)" data-en="Clear">إفراغ التأثيث</button>
    </div>
    <div class="grp only2d" id="layers">
      <button class="btn chip on" data-layer="dims" data-en="Dims">الأبعاد</button>
      <button class="btn chip on" data-layer="labels" data-en="Rooms">الغرف</button>
      <button class="btn chip on" data-layer="furn" data-en="Furniture">الأثاث</button>
      <button class="btn chip" data-layer="grid" data-en="Grid">الشبكة</button>
      <button class="btn chip" data-layer="bearing" data-en="Bearing walls">جدران حاملة</button>
      <button class="btn chip on" data-layer="wallSnap" title="محاذاة ومغناطيسية للجدران أثناء السحب" data-en-title="Snap furniture to walls while dragging" data-en="Wall snap">محاذاة للجدار</button>
    </div>
    <div class="grp only3d">
      <button class="btn chip on" data-cut="2.8" data-en="Full walls">جدران كاملة</button>
      <button class="btn chip" data-cut="1.2" data-en="Cut walls">جدران مقطوعة</button>
    </div>
    <div class="grp only3d" id="toggles3d">
      <button class="btn chip on" data-t="furn" data-en="Furniture">الأثاث</button>
      <button class="btn chip on" data-t="labels" data-en="Labels">تسميات الغرف</button>
      <button class="btn chip" data-t="night" data-en="Night">إضاءة ليلية</button>
    </div>
    <div class="grp only3d"><label class="range"><span data-en="Sun">أشعة الشمس</span> <input type="range" id="sun" min="7" max="18" step=".25" value="10" style="width:84px"><span id="sunT">10:00</span></label></div>
    <div class="spacer"></div>
    <div class="grp" id="langSel" role="group" aria-label="Language / اللغة">
      <button class="btn chip" data-lang="zh" title="العربية">عربي</button>
      <button class="btn chip" data-lang="en" title="English">EN</button>
    </div>
    <button class="btn" id="fullscreen" title="ملء الشاشة (Shift+F)" style="border:1px solid var(--line);background:#fff">⛶ ملء الشاشة</button>
    <details class="menu"><summary class="btn" data-en="File ▾">ملف ▾</summary>
      <div class="menu-pop">
        <button class="btn" id="exportPng" data-en="Export image">تصدير صورة</button>
        <button class="btn" id="exportJson" data-en="Export plan JSON">تصدير JSON</button>
        <button class="btn" id="importJson" data-en="Import plan">استيراد تصميم</button>
        <button class="btn danger" id="reset" data-en="Reset to default">استعادة الافتراضي</button>
      </div></details>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </header>

  <aside class="lib">
    <div id="lib3d" class="only3d">
      <h4 data-en="Rooms · click to fly there">قائمة الغرف · اضغط للطيران إليها</h4>
      <div id="roomList"></div>
    </div>
    <div id="lib"></div>
  </aside>

  <main id="stage">
    <svg id="plan" class="tool-select" font-family="'Tajawal', -apple-system, sans-serif">
      <defs id="defs"></defs>
      <g id="gGrid"></g>
      <g id="gRooms"></g>
      <g id="gFurn"></g>
      <g id="gWalls"></g>
      <g id="gOpen"></g>
      <g id="gLabels" pointer-events="none"></g>
      <g id="gDims" pointer-events="none"></g>
      <g id="gMeasure" pointer-events="none"></g>
      <g id="gSel"></g>
    </svg>
    <div id="view3d">
      <div id="walkOverlay"><div><h3 data-en="Walk mode">وضع الجولة الافتراضية</h3>
        <p id="wo1"></p>
        <p id="wo2"></p>
        <p id="wo3"></p></div></div>
      <div id="cross"></div>
      <div id="joy"><i></i></div>
      <button class="btn primary" id="walkExit" data-en="Exit walk">الخروج من الجولة</button>
      <div id="hint3d" data-en="Left-drag orbits · right-drag pans · scroll zooms · select furniture to drag it · click doors to open">سحب باليسار للتدوير · سحب باليمين للتحريك · عجلة الماوس للتقريب · انقر الأبواب للفتح</div>
    </div>
    <div class="scalebar" id="scalebar"><span id="sbText">1 m</span><div class="bar" id="sbBar"></div></div>
    <div class="modehint" id="modehint"></div>
    <div id="fab"></div>
  </main>

  <aside class="right"><div id="panel"></div></aside>

  <footer>
    <span class="only2d">X <b id="cx">—</b></span><span class="only2d">Y <b id="cy">—</b></span>
    <span class="only2d"><span data-en="Scale">المقياس الحالي</span> <b id="ratio">—</b></span>
    <span id="hover" class="only2d"></span>
    <span class="spacer"></span>
    <span id="tip"></span>
  </footer>
</div>
<div id="toast"></div>

<!-- Application Main Modular Entry Point -->
<script type="module" src="js/app.js"></script>
</body>
</html>
